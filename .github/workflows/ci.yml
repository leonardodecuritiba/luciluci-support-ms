name: ci

on:
    pull_request:
    push:
        branches:
            - main
            - develop

jobs:
    quality:
        runs-on: ubuntu-latest
        env:
            DB_HOST: 127.0.0.1
            DB_PORT: 5432
            DB_USER: postgres
            DB_PASSWORD: postgres
            DB_NAME: standard_ms
            TEST_DB_NAME: standard_ms_test
            RABBITMQ_HOST: 127.0.0.1
            RABBITMQ_PORT: 5672
            RABBITMQ_USERNAME: guest
            RABBITMQ_PASSWORD: guest
            RABBITMQ_VHOST: /
            RABBITMQ_PROFILE_EXCHANGE: profile.events
            OUTBOX_POLL_INTERVAL_MS: 2000
            OUTBOX_BATCH_SIZE: 20
            CONSUMER_PREFETCH: 10
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready -U postgres"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5
            rabbitmq:
                image: rabbitmq:4-management
                env:
                    RABBITMQ_DEFAULT_USER: guest
                    RABBITMQ_DEFAULT_PASS: guest
                    RABBITMQ_DEFAULT_VHOST: /
                ports:
                    - 5672:5672
                options: >-
                    --health-cmd="rabbitmq-diagnostics -q ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run build
            - run: npm run openapi:export
            - name: Check OpenAPI artifact sync
              run: git diff --exit-code docs/openapi/v1/profiles-api.json
            - run: npm run openapi:check
            - name: Check OpenAPI backward compatibility
              run: |
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                    git fetch origin "${{ github.base_ref }}" --depth=1
                    if git cat-file -e FETCH_HEAD:docs/openapi/v1/profiles-api.json 2>/dev/null; then
                      git show FETCH_HEAD:docs/openapi/v1/profiles-api.json > /tmp/profiles-api-baseline.json
                      npm run openapi:compat -- /tmp/profiles-api-baseline.json docs/openapi/v1/profiles-api.json
                    else
                      echo "No OpenAPI baseline found on base branch; skipping backward compatibility check."
                    fi
                  elif git cat-file -e HEAD^:docs/openapi/v1/profiles-api.json 2>/dev/null; then
                    git show HEAD^:docs/openapi/v1/profiles-api.json > /tmp/profiles-api-baseline.json
                    npm run openapi:compat -- /tmp/profiles-api-baseline.json docs/openapi/v1/profiles-api.json
                  else
                    echo "No OpenAPI baseline found; skipping backward compatibility check."
                  fi
            - run: npm run asyncapi:check
            - name: Check AsyncAPI backward compatibility
              run: |
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                    git fetch origin "${{ github.base_ref }}" --depth=1
                    if git cat-file -e FETCH_HEAD:docs/asyncapi/v1/standard-ms-events.json 2>/dev/null; then
                      git show FETCH_HEAD:docs/asyncapi/v1/standard-ms-events.json > /tmp/standard-ms-events-baseline.json
                      npm run asyncapi:compat -- /tmp/standard-ms-events-baseline.json docs/asyncapi/v1/standard-ms-events.json
                    else
                      echo "No AsyncAPI baseline found on base branch; skipping backward compatibility check."
                    fi
                  elif git cat-file -e HEAD^:docs/asyncapi/v1/standard-ms-events.json 2>/dev/null; then
                    git show HEAD^:docs/asyncapi/v1/standard-ms-events.json > /tmp/standard-ms-events-baseline.json
                    npm run asyncapi:compat -- /tmp/standard-ms-events-baseline.json docs/asyncapi/v1/standard-ms-events.json
                  else
                    echo "No AsyncAPI baseline found; skipping backward compatibility check."
                  fi
            - run: npm run test:coverage
            - run: npm run coverage:check
