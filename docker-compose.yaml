services:
    app:
        build:
            context: .
        container_name: support-ms-app
        restart: unless-stopped
        depends_on:
            - db
        environment:
            NODE_ENV: production
            SERVER_PORT: 3000
            DB_HOST: db
            DB_PORT: 5432
            DB_USER: ${DB_USER:-postgres}
            DB_PASSWORD: ${DB_PASSWORD:-postgres}
            DB_NAME: ${DB_NAME:-support_ms}
        ports:
            - '${SERVER_PORT:-3000}:3000'

    db:
        image: postgres:16
        container_name: support-ms-db
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${DB_USER:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
            POSTGRES_DB: ${DB_NAME:-support_ms}
        ports:
            - '${DB_PORT:-5432}:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data:
