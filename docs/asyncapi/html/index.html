<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>standard-ms AsyncAPI</title>
		<style>
			body {
				font-family: monospace;
				margin: 0;
				padding: 24px;
				background: #0f172a;
				color: #e2e8f0;
			}
			a {
				color: #38bdf8;
			}
			pre {
				white-space: pre-wrap;
				word-break: break-word;
				background: #111827;
				padding: 16px;
				border-radius: 12px;
				overflow: auto;
			}
		</style>
	</head>
	<body>
		<h1>standard-ms AsyncAPI</h1>
		<p>
			Contrato bruto:
			<a href="/docs/asyncapi/v1/standard-ms-events.json">standard-ms-events.json</a>
		</p>
		<pre id="content">Loading...</pre>
		<script>
			fetch('/docs/asyncapi/v1/standard-ms-events.json')
				.then((response) => response.json())
				.then((json) => {
					document.getElementById('content').textContent = JSON.stringify(json, null, 2);
				})
				.catch((error) => {
					document.getElementById('content').textContent = String(error);
				});
		</script>
	</body>
</html>
